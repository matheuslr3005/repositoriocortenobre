<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sua sacola · Corte Nobre</title>
<meta name="description" content="As peças que você separou na Corte Nobre. O pedido é fechado direto com a oficina pelo WhatsApp.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#17150F">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Work+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/catalogo.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<div class="cortina" aria-hidden="true"><img src="img/selo-osso.webp" alt="" width="46" height="46"></div>
<div class="grao" aria-hidden="true"></div>
<!-- incluir:cabecalho.html -->

<main id="conteudo" class="pagina-sacola">
  <div class="wrap">
    <p class="kicker">Pedido</p>
    <h1 style="font-family:var(--font-display);font-weight:300;font-size:var(--text-display);line-height:1;margin:14px 0 40px">Sua sacola</h1>

    <div class="sacola-pagina-grid">
      <div id="sacola-corpo"></div>

      <aside class="resumo" id="sacola-pe" hidden>
        <div class="total-linha">
          <span class="legenda">Total das peças</span>
          <strong class="total-valor" id="sacola-total">R$ 0,00</strong>
        </div>
        <p class="legenda" id="sacola-nota" style="margin-bottom:18px"></p>
        <button class="btn btn-primario" id="fechar-pedido" type="button" style="width:100%">Fechar pedido no WhatsApp</button>
        <p class="legenda" style="margin-top:14px" id="sacola-rodape"></p>
      </aside>
    </div>
  </div>
</main>

<!-- incluir:rodape.html -->
<button class="zap" type="button" data-whatsapp="Olá! Vim pelo site da Corte Nobre." aria-label="Falar no WhatsApp">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 00-8.7 14.9L2 22l5.3-1.4A10 10 0 1012 2zm0 18.1c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3.1.8.8-3-.2-.3A8.1 8.1 0 1112 20.1zm4.5-5.9c-.2-.1-1.4-.7-1.7-.8-.2-.1-.4-.1-.5.1l-.7.9c-.1.2-.3.2-.5.1a6.6 6.6 0 01-3.3-2.9c-.1-.2 0-.4.1-.5l.4-.5c.1-.2.1-.3 0-.5l-.7-1.7c-.2-.4-.4-.4-.5-.4h-.5c-.2 0-.5.1-.7.3-.8.8-1 1.9-.6 3.1a11 11 0 004.3 4.6c1.6.8 2.7.7 3.5.6.5-.1 1.4-.6 1.6-1.2.2-.6.2-1 .1-1.1l-.3-.1z"/></svg>
</button>
<!-- incluir:paineis-ficha.html -->
</body>
</html>
